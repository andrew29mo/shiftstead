[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftstead"
version = "0.1.0"
description = "Single-host HTTP deployments with health gates, draining and recovery"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5", "psutil==7.2.2"]

[project.scripts]
shiftstead = "rollout.__main__:main"

[tool.setuptools.packages.find]
include = ["rollout*"]
